hydra:
  run:
    dir: outputs/multiruns
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra_plugins.hydra_joblib_launcher.joblib_launcher.JoblibLauncher
    n_jobs: 1
    backend: threading
    prefer: processes
    require: null
    verbose: 0
    timeout: null
    pre_dispatch: 2*n_jobs
    batch_size: auto
    temp_folder: null
    max_nbytes: null
    mmap_mode: r
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: (%(process)d) [%(levelname)s] - (%(asctime)s) - %(name)s >> %(message)s
        datefmt: '%m/%d %H:%M:%S'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: MULTIRUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra/launcher=joblib
    - hydra.launcher.backend=threading
    - hydra.run.dir=outputs/multiruns
    - hydra.mode=MULTIRUN
    task:
    - +algorithm=ia2c
    - env.name=lbforaging:Foraging-8x8-3p-2f-v3
    - env.time_limit=50
    - env.standardise_rewards=True
    - algorithm.total_steps=1000000
    - algorithm.name=ia2c
    - algorithm.video_interval=200000
    - seed=0
    - algorithm.entropy_coef=0.001,0.01,0.1
  job:
    name: run
    chdir: true
    override_dirname: +algorithm=ia2c,algorithm.entropy_coef=0.001,0.01,0.1,algorithm.name=ia2c,algorithm.total_steps=1000000,algorithm.video_interval=200000,env.name=lbforaging:Foraging-8x8-3p-2f-v3,env.standardise_rewards=True,env.time_limit=50,seed=0
    id: ???
    num: ???
    config_name: default
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.2.0
    version_base: '1.3'
    cwd: C:\Users\nick2\Desktop\School Stuff\stats\AI-Portfolio\Fall25\689 Multi-Agent
      RL\marl-book-exercises-main\marl-book-codebase\marlbase
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: C:\Users\nick2\Desktop\School Stuff\stats\AI-Portfolio\Fall25\689 Multi-Agent
        RL\marl-book-exercises-main\marl-book-codebase\marlbase\configs
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: ???
    choices:
      algorithm: ia2c
      logger: filesystemlogger
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: file
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: joblib
      hydra/output: default
  verbose: false
seed: 0
algorithm:
  total_steps: 1000000
  log_interval: 10000
  save_interval: false
  eval_interval: 10000
  eval_episodes: 100
  video_interval: 200000
  video_frames: 500
  _target_: ac.train.main
  name: ia2c
  model:
    _target_: ac.model.A2CNetwork
    actor:
      layers:
      - 128
      - 128
      parameter_sharing: false
      use_orthogonal_init: true
      use_rnn: false
    critic:
      centralised: false
      layers:
      - 128
      - 128
      parameter_sharing: false
      use_orthogonal_init: true
      use_rnn: false
    device: cpu
  optimizer: Adam
  lr: 0.0003
  grad_clip: false
  n_steps: 5
  gamma: 0.99
  entropy_coef: 0.001
  value_loss_coef: 0.5
  use_proper_termination: false
  standardise_returns: false
  target_update_interval_or_tau: 200
env:
  _target_: utils.envs.make_env
  name: lbforaging:Foraging-8x8-3p-2f-v3
  time_limit: 50
  clear_info: false
  observe_id: false
  standardise_rewards: true
  wrappers: null
  parallel_envs: 10
logger:
  _target_: utils.loggers.FileSystemLogger
  project_name: fastmarl
