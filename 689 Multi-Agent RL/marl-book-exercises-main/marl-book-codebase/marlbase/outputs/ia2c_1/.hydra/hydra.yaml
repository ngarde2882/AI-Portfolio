hydra:
  run:
    dir: outputs/ia2c_1
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    submitit_folder: ${hydra.sweep.dir}/.submitit/%j
    timeout_min: 2880
    cpus_per_task: 1
    gpus_per_node: null
    tasks_per_node: 1
    mem_gb: 4
    nodes: 1
    name: ${hydra.job.name}
    stderr_to_stdout: false
    _target_: hydra_plugins.hydra_submitit_launcher.submitit_launcher.LocalLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: (%(process)d) [%(levelname)s] - (%(asctime)s) - %(name)s >> %(message)s
        datefmt: '%m/%d %H:%M:%S'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.run.dir=outputs/ia2c_1
    - hydra.mode=RUN
    task:
    - +algorithm=ia2c
    - env.name=lbforaging:Foraging-8x8-3p-2f-v3
    - env.time_limit=50
    - env.standardise_rewards=True
    - algorithm.total_steps=1000000
    - algorithm.name=ia2c
    - algorithm.video_interval=200000
    - seed=0
  job:
    name: run
    chdir: true
    override_dirname: +algorithm=ia2c,algorithm.name=ia2c,algorithm.total_steps=1000000,algorithm.video_interval=200000,env.name=lbforaging:Foraging-8x8-3p-2f-v3,env.standardise_rewards=True,env.time_limit=50,seed=0
    id: ???
    num: ???
    config_name: default
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.2.0
    version_base: '1.3'
    cwd: C:\Users\nick2\Desktop\School Stuff\stats\AI-Portfolio\Fall25\689 Multi-Agent
      RL\marl-book-exercises-main\marl-book-codebase\marlbase
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: C:\Users\nick2\Desktop\School Stuff\stats\AI-Portfolio\Fall25\689 Multi-Agent
        RL\marl-book-exercises-main\marl-book-codebase\marlbase\configs
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: C:\Users\nick2\Desktop\School Stuff\stats\AI-Portfolio\Fall25\689
      Multi-Agent RL\marl-book-exercises-main\marl-book-codebase\marlbase\outputs\ia2c_1
    choices:
      algorithm: ia2c
      logger: filesystemlogger
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: file
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: submitit_local
      hydra/output: default
  verbose: false
